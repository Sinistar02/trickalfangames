<!-- 네르와 마요는 사랑입니다. 줄여서 마요네르조아 -->
<!doctype html>
<html lang="ko" data-theme="light" data-view="splash">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>트릭컬그라운즈</title>
  <meta name="description" content="트릭컬 팬게임들을 모두 모아, 쉽고 빠르게.">

  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 첫 페인트 전에 테마·언어·시작 화면을 정해서 깜빡임을 막는다. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('tg-theme');
        if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('tg-lang');
        if (lang === 'ko' || lang === 'ja' || lang === 'en') root.setAttribute('lang', lang);
      } catch (e) {}
      var hash = location.hash;
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var view = 'splash';
      if (/^#\/c\//.test(hash)) view = 'list';
      else if (/^#\/g\//.test(hash) || reduce) view = 'home';
      root.setAttribute('data-view', view);
      root.classList.add('no-anim');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 오른쪽 위: 언어 · 라이트/다크 -->
  <div class="controls">
    <label class="lang">
      <span class="sr-only" id="lang-label">언어</span>
      <select id="lang-select" aria-labelledby="lang-label">
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="bgm-toggle" id="bgm-toggle" type="button" role="switch" aria-checked="false" aria-label="배경음악" title="배경음악">
      <svg class="bgm-toggle__icon bgm-toggle__icon--on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M4 9.5v5h3.5l5 4v-13l-5 4H4z" fill="currentColor"/>
        <path d="M16 9a4 4 0 0 1 0 6M18.6 6.4a7.7 7.7 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="bgm-toggle__icon bgm-toggle__icon--off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M4 9.5v5h3.5l5 4v-13l-5 4H4z" fill="currentColor"/>
        <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false">
      <span class="theme-switch__track" aria-hidden="true">
        <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 24 24" width="14" height="14">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>
          </g>
        </svg>
        <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 24 24" width="14" height="14">
          <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="currentColor"/>
        </svg>
        <span class="theme-switch__knob"></span>
      </span>
    </button>
  </div>

  <!-- 로고 -->
  <header class="hero" id="hero">
    <h1 class="sr-only" id="site-title">트릭컬그라운즈</h1>
    <!-- 배경음악 자동 재생이 막힌 브라우저에서만 첫 화면에 나타나는 안내 -->
    <p class="splash-hint" id="splash-hint" aria-live="polite"></p>
    <img class="hero__logo" id="logo" src="assets/logo.webp" alt="" width="1191" height="1191" decoding="async">
  </header>

  <!-- 게임 목록 패널 (홈 / 전체 목록 화면은 JS가 채운다) -->
  <main class="panel" id="panel">
    <div class="panel__inner" id="panel-content"></div>
    <noscript>
      <p class="noscript">이 사이트를 보려면 JavaScript가 필요해요. / このサイトにはJavaScriptが必要です。 / This site requires JavaScript.</p>
    </noscript>
  </main>

  <!-- 맨 밑 문구: data/games.js 의 최상위 creator 값 -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- 게임 상세 팝업 -->
  <div class="modal" id="modal" aria-hidden="true" inert>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal__close" id="modal-close" type="button" data-close>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <div class="modal__top">
        <div class="thumb modal__thumb" id="modal-thumb"></div>
        <div class="modal__info">
          <h2 class="modal__title" id="modal-title"></h2>
          <p class="modal__creator" id="modal-creator"></p>
          <p class="modal__meta" id="modal-released"></p>
          <p class="modal__meta" id="modal-genres"></p>
          <a class="play-btn" id="modal-play" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
      <p class="modal__desc" id="modal-desc"></p>
    </div>
  </div>

  <!-- 화면 맨 밑을 돌아다니는 스피키들 (js/speaki.js) -->
  <div class="speaki-field" id="speaki-field" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="data/games.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/speaki.js"></script>
  <script src="js/bgm.js"></script>
  <script src="js/sfx.js"></script>
</body>
</html>
